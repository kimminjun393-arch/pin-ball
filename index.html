<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>온라인 리얼 핑퐁</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { background-color: #111; color: #fff; text-align: center; font-family: 'Courier New', Courier, monospace; margin: 0; padding-top: 30px; user-select: none; }
        #setup { margin-bottom: 20px; }
        input { padding: 10px; font-size: 16px; width: 200px; text-align: center; border-radius: 0; border: 2px solid #fff; background: #000; color: #fff; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; font-weight: bold; background: #fff; color: #000; border: 2px solid #fff; transition: 0.2s; }
        button:hover { background: #000; color: #fff; }
        canvas { background-color: #000; border: 4px solid #fff; display: none; margin: 0 auto; box-shadow: 0 0 20px rgba(255,255,255,0.2); touch-action: none; }
        #status { color: #0f0; margin-top: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <div id="setup">
        <h1>ARCADE PONG</h1>
        <input type="text" id="roomInput" placeholder="방 이름 (예: pong123)"><br><br>
        <button onclick="startGame(true)">방 만들기 (왼쪽/방장)</button>
        <button onclick="startGame(false)">접속하기 (오른쪽/손님)</button>
        <div id="status"></div>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        let client;
        let room = "";
        let isHost = false;
        let gameActive = false;

        // 게임 변수 세팅
        let myY = 150;
        const p1 = { x: 20, y: 150, width: 10, height: 100, score: 0 };
        const p2 = { x: 770, y: 150, width: 10, height: 100, score: 0 };
        const ball = { x: 400, y: 200, r: 8, dx: 6, dy: 6, speed: 6 };

        // 조작 (마우스 & 터치 모두 지원)
        function movePaddle(yPos) {
            const rect = canvas.getBoundingClientRect();
            let newY = yPos - rect.top - (p1.height / 2);
            if(newY < 0) newY = 0;
            if(newY > canvas.height - p1.height) newY = canvas.height - p1.height;
            myY = newY;
        }

        canvas.addEventListener("mousemove", (e) => movePaddle(e.clientY));
        canvas.addEventListener("touchmove", (e) => {
            movePaddle(e.touches[0].clientY);
            e.preventDefault(); // 모바일 화면 스크롤 방지
        }, {passive: false});

        function startGame(hostRole) {
            const roomName = document.getElementById("roomInput").value.trim();
            if (!roomName) return alert("방 이름을 입력하세요!");

            isHost = hostRole;
            room = "github-game/pong/" + roomName;
            
            document.getElementById("setup").style.display = "none";
            canvas.style.display = "block";

            client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            
            client.on('connect', () => {
                client.subscribe(room + '/host');
                client.subscribe(room + '/guest');
                gameActive = true;
                requestAnimationFrame(draw);
            });

            client.on('message', (topic, message) => {
                const data = JSON.parse(message.toString());
                
                if (isHost && topic === room + '/guest') {
                    // 방장은 손님의 패들 위치만 받음
                    p2.y = data.p2y;
                } 
                else if (!isHost && topic === room + '/host') {
                    // 손님은 방장이 계산한 모든 물리 결과값을 받음
                    p1.y = data.p1y;
                    ball.x = data.bx;
                    ball.y = data.by;
                    p1.score = data.s1;
                    p2.score = data.s2;
                }
            });

            // 초당 약 30회 통신 (너무 잦은 통신으로 인한 서버 딜레이 방지)
            setInterval(() => {
                if (!gameActive) return;
                if (isHost) {
                    client.publish(room + '/host', JSON.stringify({ 
                        p1y: p1.y, bx: ball.x, by: ball.y, s1: p1.score, s2: p2.score 
                    }));
                } else {
                    client.publish(room + '/guest', JSON.stringify({ p2y: p2.y }));
                }
            }, 30);
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
        }

        // 방장 전용 물리 연산
        function updatePhysics() {
            p1.y = myY; // 내 패들 위치 적용
            
            ball.x += ball.dx;
            ball.y += ball.dy;

            // 위아래 벽 충돌
            if (ball.y - ball.r < 0 || ball.y + ball.r > canvas.height) {
                ball.dy *= -1;
            }

            // 왼쪽 패들 충돌
            if (ball.x - ball.r < p1.x + p1.width && ball.y > p1.y && ball.y < p1.y + p1.height) {
                ball.dx = Math.abs(ball.dx) + 0.5; // 맞출 때마다 속도 증가
                ball.x = p1.x + p1.width + ball.r; // 끼임 방지
            }

            // 오른쪽 패들 충돌
            if (ball.x + ball.r > p2.x && ball.y > p2.y && ball.y < p2.y + p2.height) {
                ball.dx = -Math.abs(ball.dx) - 0.5;
                ball.x = p2.x - ball.r;
            }

            // 점수 판정
            if (ball.x < 0) { p2.score++; resetBall(); }
            else if (ball.x > canvas.width) { p1.score++; resetBall(); }
        }

        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawText(text, x, y) {
            ctx.fillStyle = "#FFF";
            ctx.font = "50px Courier New";
            ctx.fillText(text, x, y);
        }

        function draw() {
            if (isHost) updatePhysics();
            else p2.y = myY; // 손님일 때는 내 패들을 오른쪽으로 동기화

            // 화면 지우기 (배경)
            drawRect(0, 0, canvas.width, canvas.height, "#000");

            // 중앙 점선
            for (let i = 0; i <= canvas.height; i += 30) {
                drawRect(canvas.width / 2 - 2, i, 4, 15, "#fff");
            }

            // 점수 표시
            drawText(p1.score, canvas.width / 4, 80);
            drawText(p2.score, 3 * canvas.width / 4, 80);

            // 패들과 공 그리기
            drawRect(p1.x, p1.y, p1.width, p1.height, "#fff");
            drawRect(p2.x, p2.y, p2.width, p2.height, "#fff");
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.fill();

            requestAnimationFrame(draw);
        }
    </script>
</body>
</html>
